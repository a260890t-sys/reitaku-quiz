  body {
    margin: 0;
    padding: 24px;
    background: #ece7dd;
    display: flex;
    justify-content: center;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .phone {
    width: 380px;
    border-radius: 28px;
    padding: 0;
    box-sizing: border-box;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    position: relative;
    background-image: var(--bg-photo);
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
  }
  .result-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(20,10,35,0.55);
    z-index: 50;
    pointer-events: none;
  }
  .result-overlay.show { display: flex; }
  .result-overlay-text {
    font-family: 'Mochiy Pop One', 'Hiragino Sans', sans-serif;
    font-size: 52px;
    color: #ffe066;
    -webkit-text-stroke: 4px #6b2fa0;
    paint-order: stroke fill;
    transform: rotate(-6deg) scale(0);
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1) forwards;
    text-align: center;
  }
  .result-overlay-text.wrong-text {
    color: #f0f0f0;
    -webkit-text-stroke: 4px #a33a3a;
    font-size: 40px;
  }
  @keyframes popIn {
    0% { transform: rotate(-6deg) scale(0); }
    60% { transform: rotate(-6deg) scale(1.15); }
    100% { transform: rotate(-6deg) scale(1); }
  }
  .scene {
    position: relative;
    padding: 20px 18px 24px;
    background:
      linear-gradient(to bottom, rgba(20,10,35,0.25) 0%, rgba(24,14,42,0.5) 55%, rgba(28,19,48,0.88) 100%);
    overflow: hidden;
  }
  .moon {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fdeec2, #f3cf6e 60%, #e0b64f 100%);
    box-shadow: 0 0 50px 10px rgba(243,207,110,0.35);
    z-index: 0;
  }
  .star {
    position: absolute;
    color: #f3cf6e;
    font-size: 14px;
    z-index: 1;
  }
  .bat {
    position: absolute;
    font-size: 15px;
    z-index: 1;
    opacity: 0.85;
    filter: brightness(0.35);
  }
  .web-corner {
    position: absolute;
    font-size: 46px;
    z-index: 1;
    opacity: 0.28;
    color: #e6d9f5;
    line-height: 1;
  }
  .haunted-row {
    position: absolute;
    bottom: 190px;
    left: 0;
    right: 0;
    height: 90px;
    background: linear-gradient(to top, #1c1330 30%, transparent);
    z-index: 0;
  }
  .top-row {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 16px;
  }
  .badge {
    background: #241733;
    border: 1.5px solid #6b4fa0;
    border-radius: 4px;
    clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge .icon { font-size: 22px; }
  .label { font-size: 11px; color: #d8c9ec; }
  .value { font-size: 17px; font-weight: 700; color: #fff; }
  .timer-row {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #241733;
    border: 1.5px solid #6b4fa0;
    border-radius: 20px;
    padding: 6px 14px;
    margin-bottom: 22px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
  }
  .timer-row .clock-badge {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #f2e9d8;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .timer-row .clock { font-size: 13px; }
  .timer-label { font-size: 12px; color: #fff; font-weight: 700; letter-spacing: 1px; }
  .timer-bar {
    width: 148px;
    height: 10px;
    border-radius: 3px;
    display: flex;
    gap: 2px;
  }
  .timer-bar span {
    flex: 1;
    height: 100%;
    border-radius: 1px;
  }
  .character-wrap {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    margin-bottom: 6px;
  }
  .character-wrap img {
    width: 210px;
    height: auto;
    transition: transform 0.3s ease;
    transform-origin: center center;
  }
  .q-mark {
    position: absolute;
    font-size: 26px;
    font-weight: 700;
    z-index: 2;
  }
  .pumpkins-row {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 4px;
    margin-bottom: -14px;
  }
  .pumpkin { font-size: 42px; filter: drop-shadow(0 0 8px rgba(243,166,50,0.55)); }
  .pumpkin.small { font-size: 26px; filter: none; opacity: 0.9; }
  .candle { font-size: 24px; margin: 0 2px; }
  .witch-pumpkin { position: relative; display: inline-block; width: 30px; height: 30px; }
  .witch-pumpkin .pumpkin.small { position: absolute; bottom: 0; left: 2px; }
  .witch-pumpkin .hat-brim {
    position: absolute;
    top: 6px;
    left: -2px;
    width: 26px;
    height: 4px;
    background: #2a1a3d;
    border-radius: 50%;
  }
  .witch-pumpkin .hat-cone {
    position: absolute;
    top: -10px;
    left: 6px;
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 17px solid #2a1a3d;
    transform: rotate(-10deg);
  }
  .panel-area {
    background: rgba(28,19,48,0.9);
    padding: 22px 16px 18px;
  }
  .question-box {
    position: relative;
    background: #241733;
    border: 1.5px solid #7a5bb5;
    border-radius: 4px;
    clip-path: polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    padding: 20px 16px;
    margin-bottom: 16px;
    min-height: 40px;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .q-corner-deco {
    position: absolute;
    color: #7a5bb5;
    opacity: 0.4;
    z-index: 0;
  }
  .q-web {
    top: -6px;
    left: 4px;
    font-size: 30px;
  }
  .q-house {
    bottom: -8px;
    right: 4px;
    font-size: 32px;
  }
  .q-label, .q-text { position: relative; z-index: 1; }
  .q-label { color: #f5a623; font-size: 20px; font-weight: 700; margin-right: 8px; }
  .q-text { color: #fff; font-size: 20px; letter-spacing: 3px; font-weight: 700; }
  .q-text.is-typing::after {
    content: '';
    display: inline-block;
    width: 2px;
    height: 1em;
    margin-left: 2px;
    vertical-align: -0.15em;
    background: currentColor;
    animation: typeCursorBlink 0.8s steps(1) infinite;
  }
  @keyframes typeCursorBlink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .choices {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .choice {
    background: #f5efe1;
    border: 2px solid #4a3370;
    border-radius: 4px;
    clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .choice:active { transform: scale(0.97); }
  .choice.correct { background: #d9f0d0; border-color: #3f8f2f; }
  .choice.wrong { background: #f5d8d8; border-color: #a33a3a; }
  .choice.disabled { cursor: default; }
  .choice.blink-correct {
    animation: choiceBlinkCorrect 0.45s ease-in-out 3;
  }
  @keyframes choiceBlinkCorrect {
    0%, 100% { background: #d9f0d0; border-color: #3f8f2f; box-shadow: none; }
    50% { background: #3f8f2f; border-color: #d9f0d0; box-shadow: 0 0 10px rgba(63,143,47,0.7); }
  }
  .result-text {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    min-height: 20px;
    margin-bottom: 10px;
  }
  .result-text.correct { color: #3f8f2f; }
  .result-text.wrong { color: #a33a3a; }
  .choice-letter {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .purple { background: #6b4fa0; }
  .orange { background: #e08a2b; }
  .choice-text {
    font-size: 14px;
    color: #2a1a3d;
    letter-spacing: 2px;
    font-weight: 700;
    flex: 1;
  }
  .choice-icon { font-size: 18px; }
  .bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .action-btn {
    cursor: pointer;
    background: #241733;
    border: 1.5px solid #6b4fa0;
    border-radius: 4px;
    clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    padding: 10px 14px;
    font-size: 12px;
    color: #f2e9d8;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .potion { font-size: 30px; }
</style>
</head>

    }, 520);
    setTimeout(function() {
      img.src = ghostTroubledSrc;
      img.style.transform = 'scaleX(1)';
    }, 700);
    setTimeout(function() {
      img.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
      img.style.transform = 'translateY(60px) scaleX(1)';
      img.style.opacity = '0';
    }, 1150);
    setTimeout(function() {
      img.style.transition = 'none';
      img.src = ghostFrontSrc;
      img.style.transform = 'translateY(0) scaleX(1)';
      img.style.opacity = '1';
    }, 1620);
  }
    var answered = false;
  function selectChoice(el) {
    if (answered) return;
    answered = true;
    var choices = document.querySelectorAll('#choices .choice');
    choices.forEach(function(c) { c.classList.add('disabled'); });
    var isCorrect = el.getAttribute('data-correct') === 'true';
    var overlay = document.getElementById('resultOverlay');
    var overlayText = document.getElementById('resultOverlayText');
    if (isCorrect) {
      el.classList.add('correct');
      overlayText.textContent = '正解！';
      overlayText.classList.remove('wrong-text');
      playGhostReaction();
    } else {
      el.classList.add('wrong');
      overlayText.textContent = 'ざんねん！';
      overlayText.classList.add('wrong-text');
      choices.forEach(function(c) {
        if (c.getAttribute('data-correct') === 'true') {
          c.classList.add('correct');
          c.classList.add('blink-correct');
        }
      });
    }
    overlay.classList.add('show');
    setTimeout(function() {
      overlay.classList.remove('show');
      goToNextQuestion();
    }, 1400);
  }

  function giveUp() {
    answered = false;
    var choices = document.querySelectorAll('#choices .choice');
    choices.forEach(function(c) {
      c.classList.remove('disabled', 'correct', 'wrong', 'blink-correct');
    });
    var overlay = document.getElementById('resultOverlay');
    overlay.classList.remove('show');
    var img = document.getElementById('ghostImg');
    img.style.transition = 'none';
    img.style.transform = 'translateY(0) scaleX(1)';
    img.style.opacity = '1';
    img.src = ghostFrontSrc;
  }

  // ===== タイプライターエフェクト =====
  // 1文字ずつ文字を表示していく演出。要素に素のテキストを渡すと、
  // 既存の中身をいったん空にしてから少しずつ流し込む。
  function typeWriterEffect(el, text, speed, onDone) {
    el.textContent = '';
    el.classList.add('is-typing');
    var i = 0;
    function step() {
      if (i < text.length) {
        el.textContent += text.charAt(i);
        i++;
        setTimeout(step, speed);
      } else {
        el.classList.remove('is-typing');
        if (typeof onDone === 'function') onDone();
      }
    }
    step();
  }

  // ===== 問題データ =====
  var quizQuestions = [
    {
      question: '麗澤大学の広大なキャンパス（柏市光ヶ丘）全体の敷地面積は、おおよそ東京ドーム何個分に相当するでしょうか？',
      choices: [
        { text: '約1個分', correct: false },
        { text: '約3個分', correct: false },
        { text: '約10個分', correct: true },
        { text: '約30個分', correct: false }
      ]
    },
    {
      question: '麗澤大学の主要な最寄り駅は「南柏駅（JR常磐線）」ですが、駅からキャンパス（正門）までは歩いて約何分かかるでしょうか？',
      choices: [
        { text: '歩いて約3分', correct: false },
        { text: '歩いて約15分', correct: true },
        { text: '歩いて約45分', correct: false },
        { text: '歩いて約2時間', correct: false }
      ]
    },
    {
      question: '麗澤大学のキャンパスは、その豊かな自然環境や景観の美しさから、どのような評価（賞）を受けたことがあるでしょうか？',
      choices: [
        { text: '千葉県「最も静かなキャンパス賞」', correct: false },
        { text: '都市景観大賞「美しいまちなみ優秀賞」', correct: true },
        { text: '日本「学食が一番おいしい大学賞」', correct: false },
        { text: '世界「エコ・キャンパス・コンテスト金賞」', correct: false }
      ]
    }
  ];
  var currentQuestionIndex = 0;

  // 問題文だけをタイプライター表示する（選択肢は即時表示のまま）。
  function playQuestionTypewriter(text) {
    var qText = document.querySelector('.q-text');
    typeWriterEffect(qText, text, 70);
  }

  // 指定したインデックスの問題を画面に反映する
  function renderQuestion(index) {
    var q = quizQuestions[index];
    if (!q) return;

    answered = false;

    var choiceEls = document.querySelectorAll('#choices .choice');
    choiceEls.forEach(function(el, i) {
      var choiceData = q.choices[i];
      el.setAttribute('data-correct', choiceData.correct ? 'true' : 'false');
      el.classList.remove('disabled', 'correct', 'wrong', 'blink-correct');
      el.querySelector('.choice-text').textContent = choiceData.text;
    });

    var stageValue = document.getElementById('stageValue');
    if (stageValue) stageValue.textContent = (index + 1) + '/' + quizQuestions.length;

    playQuestionTypewriter(q.question);
  }

  // 次の問題へ進む（最後の問題なら何もしない）
  function goToNextQuestion() {
    if (currentQuestionIndex < quizQuestions.length - 1) {
      currentQuestionIndex++;
      renderQuestion(currentQuestionIndex);
    }
  }

  // ページ読み込み（＝出題）時に1問目を表示
  document.addEventListener('DOMContentLoaded', function() {
    renderQuestion(currentQuestionIndex);
  });
</script>
